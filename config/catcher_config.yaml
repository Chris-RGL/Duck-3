behaviors:
  Catcher:
    trainer_type: ppo

    hyperparameters:
      buffer_size: 10240
      batch_size: 128
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 0.005
      epsilon: 0.2
      lambd: 0.99
      num_epoch: 3

    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    # Episodes are short (positioningSteps + flight), so steps accumulate quickly.
    max_steps: 1000000
    # Must be longer than one full episode (positioningSteps + flight decisions).
    time_horizon: 128
    summary_freq: 10000
    checkpoint_interval: 100000
    keep_checkpoints: 5
