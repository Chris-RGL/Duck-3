behaviors:
  Pendulum:
    trainer_type: ppo

    hyperparameters:
      # Scaled up from 10240 for 32 parallel agents. Larger buffer ensures each
      # update draws diverse experience from all 32 agents before any gradient step.
      buffer_size: 20480

      # Scaled proportionally with buffer_size to maintain minibatch ratio.
      batch_size: 256

      learning_rate: 3.0e-4
      learning_rate_schedule: linear

      beta: 0.005
      epsilon: 0.2
      lambd: 0.99
      num_epoch: 3

    network_settings:
      normalize: true
      hidden_units: 128
      num_layers: 2

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    # With 32 agents steps accumulate 32x faster, so 500k was exhausted almost
    # immediately. 2M gives each agent ~62k decisions of training time.
    max_steps: 2000000

    # Per-agent bootstrap interval — unchanged, this is independent of agent count.
    time_horizon: 64

    # Scaled up so TensorBoard logs and checkpoints land at meaningful training
    # milestones rather than every few seconds of wall-clock time.
    summary_freq: 10000
    checkpoint_interval: 100000
    keep_checkpoints: 5
