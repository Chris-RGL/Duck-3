behaviors:
  Rocket:
    trainer_type: ppo

    hyperparameters:
      buffer_size: 1024
      batch_size: 64
      learning_rate: 3.0e-4
      learning_rate_schedule: linear
      beta: 0.005
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3

    network_settings:
      normalize: true
      hidden_units: 64
      num_layers: 2

    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0

    max_steps: 10000
    time_horizon: 64
    summary_freq: 500
    checkpoint_interval: 2000
    keep_checkpoints: 5
